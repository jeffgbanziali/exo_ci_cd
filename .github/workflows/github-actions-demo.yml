name: Artifact Demo
on:
  workflow_dispatch:
  push:

jobs:
  Build-and-Store:
    runs-on: self-hosted
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Creer un fichier texte avec redirection
        run: echo "Ceci est un rapport genere par la CI le $(Get-Date)" > output.txt

      - name: Sauvegarder le fichier comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: rapport-execution
          path: output.txt